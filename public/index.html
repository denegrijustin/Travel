<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#215b50">
<meta name="description" content="Trip dates, destinations, and daily itineraries.">
<title>Travel</title>
<style>
:root{--ink:#17201d;--muted:#67706c;--green:#215b50;--green2:#dfeae6;--sand:#f6f1e7;--card:#fff;--line:#e4e7e5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:var(--ink)}a{color:inherit}.shell{min-height:100dvh;display:grid;grid-template-columns:240px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100dvh}.brand{font-weight:800;font-size:22px;padding:6px 10px 20px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.nav a{display:block;padding:11px 12px;margin:3px 0;border-radius:12px;text-decoration:none;font-weight:650}.nav a.active,.nav a:hover{background:var(--green2);color:var(--green)}.content{padding:32px;max-width:1160px;width:100%;margin:auto}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}.hero{background:linear-gradient(135deg,#173f38,#2a6e61);color:#fff;border-radius:28px;padding:28px}.hero h1{font-size:clamp(36px,6vw,64px);line-height:.95;margin:10px 0 12px}.hero p{margin:0 0 20px;color:#e9f1ee}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:12px 14px;border-radius:14px;min-width:145px}.stat b{display:block;font-size:20px}.section{margin-top:28px}.section h2{margin:0 0 12px;font-size:24px}.note{color:var(--muted);font-size:13px}.days{display:grid;gap:14px}.day{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.date{color:var(--green);font-weight:750}.day h3{margin:3px 0 6px;font-size:20px}.desc{color:#47534f;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{background:var(--sand);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700;color:#675f4c}.tool{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.tool input,.tool textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfb}.tool button{border:0;border-radius:12px;background:var(--green);color:#fff;padding:10px 14px;font-weight:750}.row{display:flex;gap:10px}.row>*{flex:1}.list{display:grid;gap:8px;margin-top:12px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px}.empty{color:var(--muted);padding:16px 0}.mobile{display:none}@media(max-width:820px){.shell{display:block}.side{display:none}.content{padding:18px 16px 90px}.hero{border-radius:22px;padding:22px}.mobile{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:6px;overflow:auto}.mobile a{flex:0 0 auto;text-decoration:none;font-size:12px;font-weight:750;padding:10px;border-radius:12px}.mobile a.active{background:var(--green2);color:var(--green)}}
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.tcard{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;transition:transform .15s,box-shadow .15s}.tcard:hover,.tcard:focus-visible{transform:translateY(-2px);box-shadow:0 10px 28px rgba(23,32,29,.12)}.tcard .cover{background:linear-gradient(135deg,#173f38,#2a6e61);color:#fff;padding:22px 20px;min-height:130px;display:flex;flex-direction:column;justify-content:flex-end}.tcard .cover h3{margin:0;font-size:28px;line-height:1}.tcard .cover span{color:#e9f1ee;font-size:14px;margin-top:6px}.tcard .meta{display:flex;gap:16px;padding:14px 20px;font-size:13px;color:var(--muted)}.tcard .meta b{display:block;color:var(--ink);font-size:15px}.back{display:inline-block;margin-bottom:14px;color:var(--green);font-weight:750;text-decoration:none}.side .tname{padding:4px 12px 10px;color:var(--muted);font-size:13px;font-weight:700}</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand"><small>Personal trip planner</small>Travel</div><nav class="nav" id="nav"></nav></aside><main class="content" id="app"></main></div><nav class="mobile" id="mobileNav"></nav>
<script>
const trips=[{id:"italy-2027",name:"Italy 2027",dates:"Jun 18 – Jun 25, 2027",duration:"8 days",destinations:"9 places",final:"Salerno",itinerary:[
["Jun 18","Arrive in Naples",["Naples"],"Arrive in Naples and head to the hotel. If time allows, enjoy a relaxed evening along the lungomare, with an optional visit to Museo Cappella Sansevero and pizza in the historic center."],
["Jun 19","Salerno → Positano",["Salerno","Positano","Laurito Cove"],"Check in at Marina d'Arechi, provision and set sail west. Swim at Laurito Cove if conditions allow, then spend the evening exploring Positano."],
["Jun 20","Positano → Procida",["Procida","Chiaiolella","Marina di Corricella"],"Cruise into the Gulf of Naples toward colorful Procida. Explore on foot, enjoy beach time at Chiaiolella and finish in Marina di Corricella."],
["Jun 21","Procida → Ischia",["Ischia","Castello Aragonese","La Mortella"],"Sail to Ischia for gardens, thermal waters and a relaxed island afternoon. Optional Castello Aragonese, La Mortella or a thermal spa."],
["Jun 22","Ischia → Sorrento",["Sorrento","Marina Grande"],"Cruise toward Sorrento. Swim when conditions allow, then explore the lanes, viewpoints and Vallone dei Mulini."],
["Jun 23","Sorrento → Capri",["Capri","Marina Piccola","Faraglioni","Blue Grotto"],"Arrive at Capri, anchor near Marina Piccola when possible, see the Faraglioni and spend the afternoon ashore. Blue Grotto is optional depending on conditions."],
["Jun 24","Capri → Capo Conca Bay → Amalfi",["Capo Conca Bay","Amalfi"],"Return toward the Amalfi Coast, stop for a swim and snorkel at Capo Conca Bay, then continue to Amalfi for the cathedral piazza and narrow lanes."],
["Jun 25","Amalfi → Salerno",["Amalfi","Salerno"],"Final coastal cruise back to Salerno with time to refuel, settle accounts and enjoy a final marina evening before disembarkation."]
]}];
const sections=[["","Overview"],["reservations","Reservations"],["saved-places","Saved places"],["packing","Packing"],["expenses","Expenses"],["documents","Documents"],["notes","Notes"]];
const store={reservations:"reservations",saved:"places",packing:"packing",documents:"documents"};
let trip=null,sec="";
const key=n=>"travel-"+trip.id+"-"+n,load=(n,f)=>{try{return JSON.parse(localStorage.getItem(key(n)))??f}catch{return f}},save=(n,v)=>{try{localStorage.setItem(key(n),JSON.stringify(v))}catch{}};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function route(){const parts=location.pathname.split("/").filter(Boolean);trip=null;sec="";if(parts[0]==="trips"){trip=trips.find(t=>t.id===parts[1])||null;if(trip)sec=sections.some(x=>x[0]===(parts[2]||""))?(parts[2]||""):""}}
function nav(){let l;if(!trip)l='<a class="active" href="/" data-link>Trips</a>';else{const base="/trips/"+trip.id;l='<a href="/" data-link>← All trips</a>'+sections.map(([u,t])=>'<a class="'+(sec===u?'active':'')+'" href="'+base+(u?"/"+u:"")+'" data-link>'+t+'</a>').join("")}navEl.innerHTML=(trip?'<div class="tname">'+esc(trip.name)+'</div>':"")+l;mobileNav.innerHTML=l}
function home(){return '<div class="eyebrow">MY TRIPS</div><section class="section"><h2>Trips</h2><div class="trips">'+trips.map(t=>'<a class="tcard" href="/trips/'+t.id+'" data-link><div class="cover"><h3>'+esc(t.name)+'</h3><span>'+esc(t.dates)+'</span></div><div class="meta"><div>Duration<b>'+esc(t.duration)+'</b></div><div>Destinations<b>'+esc(t.destinations)+'</b></div><div>Ends in<b>'+esc(t.final)+'</b></div></div></a>').join("")+'</div></section>'}
function overview(){return '<a class="back" href="/" data-link>← All trips</a><div class="eyebrow">TRIP OVERVIEW</div><section class="hero"><h1>'+esc(trip.name)+'</h1><p>'+esc(trip.dates)+'</p><div class="stats"><div class="stat">Duration<b>'+esc(trip.duration)+'</b></div><div class="stat">Destinations<b>'+esc(trip.destinations)+'</b></div><div class="stat">Final destination<b>'+esc(trip.final)+'</b></div></div></section><section class="section"><h2>Itinerary</h2><div class="note" style="margin-bottom:12px">Saved on this device, in this browser. Cross-device sync is not enabled.</div><div class="days">'+trip.itinerary.map((x,i)=>'<article class="day"><div class="date">Day '+(i+1)+' · '+x[0]+'</div><h3>'+x[1]+'</h3><div class="desc">'+x[3]+'</div><div class="chips">'+x[2].map(p=>'<span class="chip">'+p+'</span>').join("")+'</div></article>').join("")+'</div></section>'}
function generic(type,title,ph){const a=load(type,[]);return '<div class="eyebrow">'+esc(trip.name.toUpperCase())+'</div><section class="section"><h2>'+title+'</h2><div class="note" style="margin-bottom:12px">Saved in this browser.</div><div class="tool"><div class="row"><input id="entry" placeholder="'+ph+'"><button id="add">Add</button></div><div class="list">'+(a.length?a.map((v,i)=>'<div class="item"><span>'+esc(v)+'</span><button data-del="'+i+'">Remove</button></div>').join(""):'<div class="empty">Nothing added yet.</div>')+'</div></div></section>'}
function render(){route();nav();document.title=(trip?trip.name+" · ":"")+"Travel";let h;
if(!trip)h=home();else if(sec==="")h=overview();else if(sec==="reservations")h=generic("reservations","Reservations","Add hotel, train, tour or confirmation");else if(sec==="saved-places")h=generic("places","Saved places","Add a restaurant, sight or place");else if(sec==="packing")h=generic("packing","Packing list","Add a packing item");else if(sec==="documents")h=generic("documents","Documents","Add a document reference or link");else if(sec==="notes")h='<div class="eyebrow">'+esc(trip.name.toUpperCase())+'</div><section class="section"><h2>Notes</h2><div class="tool"><textarea id="notes" rows="14" placeholder="Trip notes…">'+esc(load("notes",""))+'</textarea></div></section>';else h='<div class="eyebrow">'+esc(trip.name.toUpperCase())+'</div><section class="section"><h2>Expenses</h2><div class="tool"><div class="row"><input id="desc" placeholder="Expense"><input id="amt" inputmode="decimal" placeholder="Amount"><button id="addexp">Add</button></div><div class="list">'+load("expenses",[]).map((x,i)=>'<div class="item"><span>'+esc(x.d)+'</span><b>$'+Number(x.a||0).toFixed(2)+'</b><button data-expdel="'+i+'">Remove</button></div>').join("")+'</div></div></section>';
app.innerHTML=h;
const type=sec==="saved-places"?"places":sec;
if(["reservations","saved-places","packing","documents"].includes(sec)){add.onclick=()=>{const v=entry.value.trim();if(!v)return;const a=load(type,[]);a.push(v);save(type,a);render()};document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const a=load(type,[]);a.splice(+b.dataset.del,1);save(type,a);render()})}
if(sec==="notes")notes.oninput=()=>save("notes",notes.value);
if(sec==="expenses"){addexp.onclick=()=>{const d=desc.value.trim();if(!d)return;const a=load("expenses",[]);a.push({d,a:amt.value});save("expenses",a);render()};document.querySelectorAll("[data-expdel]").forEach(b=>b.onclick=()=>{const a=load("expenses",[]);a.splice(+b.dataset.expdel,1);save("expenses",a);render()})}}
const app=document.getElementById("app"),navEl=document.getElementById("nav"),mobileNav=document.getElementById("mobileNav");
document.addEventListener("click",e=>{const a=e.target.closest("a[data-link]");if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();history.pushState({},"",a.getAttribute("href"));render();scrollTo(0,0)});
addEventListener("popstate",render);render();
</script>
</body>
</html>
